name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify package checksums
        run: |
          unzip -q DaLufsPlug-*-mpc-armv7.zip
          cd DaLufsPlug-*/
          sha256sum -c SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" DaLufsPlug-*-mpc-armv7.zip \
            --title "Da Lufs Plug ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md
